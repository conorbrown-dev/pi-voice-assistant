[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pi-voice-assistant"
version = "0.1.0"
description = "Orange Castle Assistant: an offline-first family todo and reminder assistant"
requires-python = ">=3.11"

[project.optional-dependencies]
voice = ["sounddevice>=0.4.6"]
vosk = ["vosk>=0.3.45", "sounddevice>=0.4.6"]
piper = ["piper-tts>=1.4"]

[project.scripts]
pi-assistant = "pi_voice_assistant.cli:main"
pi-dashboard = "pi_voice_assistant.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]
